<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: transparent; }
  body { width: 100vmin; height: 100vmin; }
  svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>

    <rect x="11" y="7" width="34" height="43" rx="7"
          transform="rotate(-13 28 50)" fill="#189E89"/>
    <rect x="19" y="8" width="34" height="43" rx="7"
          transform="rotate(8 36 51)" fill="#A4ADB1"/>
    <rect x="17" y="18" width="35" height="42" rx="7"
          fill="#FFFFFF" stroke="#8C969A" stroke-width="1"/>
  </svg>
</body>
</html>
