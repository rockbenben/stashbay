<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { background: transparent; }
  body { width: 100vmin; height: 100vmin; }
  svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
  <!-- Neutral file stack with a bright outer keyline. The dark inner edge
       separates pale cards on light taskbars; the keyline survives dark ones. -->
  <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="100" y="41" width="298" height="366" rx="42"
          transform="rotate(-17 249 407)" fill="#555555" stroke="#FAFAFA" stroke-width="12"/>
    <rect x="115" y="40" width="298" height="366" rx="42"
          transform="rotate(10 264 406)" fill="#A5A5A5" stroke="#FAFAFA" stroke-width="12"/>
    <rect x="126" y="114" width="310" height="370" rx="44"
          fill="#F4F4F4" stroke="#FAFAFA" stroke-width="16"/>
    <rect x="126" y="114" width="310" height="370" rx="44"
          fill="#F4F4F4" stroke="#646464" stroke-width="8"/>
  </svg>
</body>
</html>
